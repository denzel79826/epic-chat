<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The (Modified) Epic Chat</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f2f4f7; margin: 0; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 560px; height: 100vh; display: flex; flex-direction: column; background: #fff; }
        header { padding: 14px 16px; border-bottom: 1px solid #e3e6ea; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        #status { font-size: 12px; font-weight: 400; color: #888; }
        #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 14px; background: #eceff3; word-wrap: break-word; }
        .msg.me { align-self: flex-end; background: #2563eb; color: #fff; }
        .msg .name { font-size: 11px; opacity: .7; margin-bottom: 2px; }
        form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e3e6ea; }
        input { flex: 1; padding: 10px 12px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 15px; }
        button { padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>
<div id="app">
    <header>The (Modified) Epic Chat <span id="status">connecting...</span></header>
    <div id="messages"></div>
    <form id="form">
        <input id="text" placeholder="Type a message..." autocomplete="off" required>
        <button type="submit">Send</button>
    </form>
</div>

<script>
    const username = prompt("Your name?") || "Anonymous";
    const messages = document.getElementById("messages");
    const statusEl = document.getElementById("status");
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/chat`);

    ws.onopen = () => statusEl.textContent = "online";
    ws.onclose = () => statusEl.textContent = "disconnected";

    ws.onmessage = (event) => {
        const { user, text } = JSON.parse(event.data);
        const div = document.createElement("div");
        div.className = "msg" + (user === username ? " me" : "");
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = user;
        const body = document.createElement("div");
        body.textContent = text;
        div.append(name, body);
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    };

    document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const input = document.getElementById("text");
        if (ws.readyState === WebSocket.OPEN && input.value.trim()) {
            ws.send(JSON.stringify({ user: username, text: input.value.trim() }));
            input.value = "";
        }
    });
</script>
</body>
</html>
